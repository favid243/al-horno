/* ===== Animaciones y microinteracciones Al Horno ===== */
@keyframes pageIn{0%{opacity:0;transform:translateY(14px) scale(.992)}100%{opacity:1;transform:none}}
@keyframes cardRise{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.7)}55%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes cartBounce{0%,100%{transform:translateY(0) scale(1)}35%{transform:translateY(-7px) scale(1.1)}65%{transform:translateY(2px) scale(.98)}}
@keyframes pulseRing{0%{box-shadow:0 0 0 0 rgba(237,109,36,.45)}70%{box-shadow:0 0 0 13px rgba(237,109,36,0)}100%{box-shadow:0 0 0 0 rgba(237,109,36,0)}}
@keyframes floatSweet{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-8px) rotate(2deg)}}
@keyframes shimmer{0%{background-position:-220% 0}100%{background-position:220% 0}}
@keyframes toastIn{0%{opacity:0;transform:translateY(18px) scale(.94)}100%{opacity:1;transform:none}}
@keyframes checkPop{0%{transform:scale(0) rotate(-20deg)}70%{transform:scale(1.18) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
#app.page-enter{animation:pageIn .42s cubic-bezier(.22,.8,.26,1)}
.card,.panel,.cat,.offer,.stat,.savedCard{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover,.cat:hover,.offer:hover,.savedCard:hover{transform:translateY(-5px);box-shadow:0 18px 42px rgba(73,45,28,.14)}
.card:hover .pic img{transform:scale(1.045)}
.pic img,.hero img,.trackHero img{transition:transform .7s cubic-bezier(.2,.7,.2,1)}
.hero:hover img,.trackHero:hover img{transform:scale(1.03)}
.primary,.soft,.ghost,.cartBtn,.heart,.nav button,.mobileNav button{transition:transform .17s ease,box-shadow .2s ease,background .2s ease,color .2s ease}
.primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(237,109,36,.28)}
.primary:active,.soft:active,.ghost:active,.cartBtn:active,.nav button:active,.mobileNav button:active{transform:scale(.96)}
.heart:hover{transform:scale(1.12)}
.heart.is-fav{color:#d94d44;animation:pop .35s cubic-bezier(.2,.9,.3,1.25)}
.cartBtn.bounce,.badge.bounce{animation:cartBounce .5s ease}
.step.current .circle{animation:pulseRing 1.65s infinite}
.step.done .circle{animation:checkPop .35s ease both}
.trackHero .trackCopy{animation:cardRise .55s .05s both}
.trackHero:before{content:'✦';position:absolute;z-index:3;right:8%;top:16%;font-size:30px;color:#ffd8b8;opacity:.7;animation:floatSweet 2.8s ease-in-out infinite}
.trackHero:after{pointer-events:none}
.toast{animation:toastIn .3s cubic-bezier(.2,.8,.2,1)}
.heroContent>*{animation:cardRise .6s both}.heroContent>*:nth-child(2){animation-delay:.06s}.heroContent>*:nth-child(3){animation-delay:.12s}.heroContent>*:nth-child(4){animation-delay:.18s}
.offer.orange,.primary{background-size:220% 100%}.primary:hover{background-image:linear-gradient(110deg,#ed6d24 0%,#ffad74 45%,#ed6d24 100%);animation:shimmer 1.4s linear infinite}
.section .grid .card{animation:cardRise .45s both}.section .grid .card:nth-child(2){animation-delay:.04s}.section .grid .card:nth-child(3){animation-delay:.08s}.section .grid .card:nth-child(4){animation-delay:.12s}.section .grid .card:nth-child(5){animation-delay:.16s}.section .grid .card:nth-child(6){animation-delay:.20s}
.loginCard{animation:pageIn .55s cubic-bezier(.2,.8,.2,1)}
.loginVisual img{animation:heroZoom 9s ease-in-out infinite alternate}@keyframes heroZoom{from{transform:scale(1)}to{transform:scale(1.06)}}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#58b36b;margin-right:6px;box-shadow:0 0 0 0 rgba(88,179,107,.45);animation:pulseLive 1.4s infinite}@keyframes pulseLive{70%{box-shadow:0 0 0 8px rgba(88,179,107,0)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition:none!important}}

function safeParse(raw,fallback){try{return raw?JSON.parse(raw):fallback}catch(e){return fallback}}
function loadAccounts(){try{return safeParse(localStorage.getItem(ACCOUNTS_STORE),{})}catch(e){return {}}}
function saveAccounts(a){try{localStorage.setItem(ACCOUNTS_STORE,JSON.stringify(a))}catch(e){}}
function userKey(email){return USER_PREFIX+String(email||'').trim().toLowerCase()}
function loadGlobal(){try{const d=safeParse(localStorage.getItem(GLOBAL_STORE),{});return{...defaultsGlobal(),...d,orders:Array.isArray(d.orders)?d.orders:[],customProducts:Array.isArray(d.customProducts)?d.customProducts:[],unavailable:Array.isArray(d.unavailable)?d.unavailable:[],supportTickets:Array.isArray(d.supportTickets)?d.supportTickets:[]}}catch(e){return defaultsGlobal()}}
function loadUser(email){try{const d=safeParse(localStorage.getItem(userKey(email)),{});return{...defaultsUser(),...d,profile:{...defaultsUser().profile,...(d.profile||{}),email},cart:Array.isArray(d.cart)?d.cart:[],favorites:Array.isArray(d.favorites)?d.favorites:[],addresses:Array.isArray(d.addresses)?d.addresses:[]}}catch(e){return{...defaultsUser(),profile:{...defaultsUser().profile,email}}}}
function clientState(email){const u=loadUser(email),g=loadGlobal(),e=email.toLowerCase();return{...u,...g,orders:g.orders.filter(o=>(o.ownerEmail||o.email||'').toLowerCase()===e),supportTickets:g.supportTickets.filter(t=>(t.ownerEmail||t.email||'').toLowerCase()===e)}}
function adminState(){return{...defaultsUser(),...loadGlobal()}}
let state=defaults(), role='', view='home', pay='Efectivo', adminOpen=false, activeUserEmail='';
function allProducts(){return [...products,...state.customProducts]}
function getProduct(id){return allProducts().find(p=>p.id===id)}
function isUnavailable(id){return state.unavailable.includes(id)}
let lastGlobalSnapshot='';let lastUserSnapshot='';
function refreshSnapshots(){try{lastGlobalSnapshot=localStorage.getItem(GLOBAL_STORE)||'';lastUserSnapshot=activeUserEmail?(localStorage.getItem(userKey(activeUserEmail))||''):''}catch(e){}}
refreshSnapshots();
let syncChannel=null;
try{syncChannel=new BroadcastChannel('al-horno-live-v4')}catch(e){}
function persistGlobalFromState(){
  const g=loadGlobal();
  if(role==='admin'){
    g.orders=state.orders;g.supportTickets=state.supportTickets;g.customProducts=state.customProducts;g.unavailable=state.unavailable;
  }else if(role==='client'&&activeUserEmail){
    const e=activeUserEmail.toLowerCase();
    g.orders=[...g.orders.filter(o=>(o.ownerEmail||o.email||'').toLowerCase()!==e),...state.orders.map(o=>({...o,ownerEmail:e}))].sort((a,b)=>(b.created||0)-(a.created||0));
    g.supportTickets=[...g.supportTickets.filter(t=>(t.ownerEmail||t.email||'').toLowerCase()!==e),...state.supportTickets.map(t=>({...t,ownerEmail:e}))].sort((a,b)=>(b.created||0)-(a.created||0));
    g.customProducts=state.customProducts;g.unavailable=state.unavailable;
  }
  try{localStorage.setItem(GLOBAL_STORE,JSON.stringify(g))}catch(e){}
}
function save(){
  try{
    if(role==='client'&&activeUserEmail){
      const u={cart:state.cart,favorites:state.favorites,profile:{...state.profile,email:activeUserEmail},addresses:state.addresses,activeOrderId:state.activeOrderId,discount:state.discount};
      localStorage.setItem(userKey(activeUserEmail),JSON.stringify(u));
    }
    persistGlobalFromState();
    refreshSnapshots();
    if(syncChannel)syncChannel.postMessage({type:'state-updated',email:activeUserEmail,at:Date.now()});
  }catch(e){}
  updateBadge();
}
function syncFromStorage(showNotice=false){
  try{
    const gRaw=localStorage.getItem(GLOBAL_STORE)||'';
    const uRaw=activeUserEmail?(localStorage.getItem(userKey(activeUserEmail))||''):'';
    if(gRaw===lastGlobalSnapshot&&uRaw===lastUserSnapshot)return;
    const previousActive=typeof getActive==='function'?getActive():null;
    const previousStatus=previousActive?Number(previousActive.status):-1;
    state=role==='admin'?adminState():(activeUserEmail?clientState(activeUserEmail):defaults());
    refreshSnapshots();
    if(role){const currentActive=typeof getActive==='function'?getActive():null;const currentStatus=currentActive?Number(currentActive.status):-1;if(view==='tracking'||view==='orders'||role==='admin')render();else updateBadge();if(showNotice&&currentActive&&currentStatus!==previousStatus)toast('Pedido actualizado: '+statusName(currentStatus));}
  }catch(e){}
}
window.addEventListener('storage',e=>{if(e.key===GLOBAL_STORE||(activeUserEmail&&e.key===userKey(activeUserEmail)))syncFromStorage(true)});
if(syncChannel)syncChannel.onmessage=()=>syncFromStorage(true);

function changeCheckoutPayment(method){
  const fields=['ckName','ckPhone','ckAddress','ckDistrict','ckEmail','ckNotes'];
  const draft=Object.fromEntries(fields.map(id=>[id,document.getElementById(id)?.value||'']));
  const accepted=document.getElementById('terms')?.checked||false;
  pay=method;render();
  for(const id of fields){const el=document.getElementById(id);if(el)el.value=draft[id]}
  const terms=document.getElementById('terms');if(terms)terms.checked=accepted;
}
function prepareWhatsApp(link){
  link.href='#';
  if(!state.cart.length){toast('Agrega un postre al carrito para continuar');return false}
  if(state.cart.some(i=>!getProduct(i.id)||isUnavailable(i.id)||!Number.isInteger(i.qty)||i.qty<1)){
    toast('Revisa el carrito: hay un producto que ya no está disponible');return false;
  }
  const read=id=>(document.getElementById(id)?.value||'').trim();
  const name=read('ckName'),phone=read('ckPhone'),address=read('ckAddress'),district=read('ckDistrict'),notes=read('ckNotes');
  if(!name||!phone||!address||!district){toast('Completa nombre, teléfono, dirección y barrio');return false}
  if(!/^[+\d\s()-]+$/.test(phone)||!/^\d{7,15}$/.test(phone.replace(/\D/g,''))){toast('Revisa el teléfono de contacto');return false}
  if(!document.getElementById('terms')?.checked){toast('Acepta los términos para continuar');return false}
  const totals=cartTotals();
  const lines=[
    'Hola, Al Horno. Quiero hacer este pedido:',
    '',
    ...state.cart.map(i=>{const p=getProduct(i.id);return `${i.qty} × ${p.name} — ${fmt(p.price)} c/u · ${fmt(p.price*i.qty)}\n${dessertDetailLines(i).map(line=>'  '+line).join('\n')}`}),
    '',
    `Subtotal: ${fmt(totals.sub)}`,
    `Descuento: -${fmt(totals.disc)}`,
    `Domicilio: ${totals.delivery?fmt(totals.delivery):'Gratis'}`,
    `${dessertPriceLabel()}: ${fmt(totals.total)} COP`,
    ...(hasDessertExtras()?['Tamaños especiales y toppings NO incluidos en el total base. Confirmar precio y disponibilidad antes de aceptar el pedido.']:[]),
    '',
    `Nombre: ${name}`,
    `Teléfono: ${phone}`,
    `Dirección: ${address}`,
    `Barrio: ${district}`,
    ...(notes?[`Indicaciones: ${notes}`]:[]),
    `Método de pago solicitado: ${pay}`,
    '',
    'Por favor confirmen disponibilidad, entrega y forma de pago.'
  ];
  link.href=`https://wa.me/${WHATSAPP_BUSINESS_NUMBER}?text=${encodeURIComponent(lines.join('\n'))}`;
  return true;
}

function placeOrder(){const name=document.getElementById('ckName').value.trim(),phone=document.getElementById('ckPhone').value.trim(),address=document.getElementById('ckAddress').value.trim(),district=document.getElementById('ckDistrict').value.trim(),email=document.getElementById('ckEmail').value.trim();if(!name||!phone||!address||!district||!email){toast('Completa los datos de entrega');return}if(!document.getElementById('terms').checked){toast('Acepta los términos para continuar');return}if(pay==='Tarjeta'&&(!document.getElementById('cardNo').value.trim()||!document.getElementById('cardCvv').value.trim())){toast('Completa los datos de la tarjeta');return}const t=cartTotals(),id='AH-'+Math.floor(10000+Math.random()*89999),order={id,created:Date.now(),updatedAt:Date.now(),status:0,name,phone,address,district,email,ownerEmail:(activeUserEmail||email).toLowerCase(),payment:pay,total:t.total,items:state.cart.map(cloneDessertItem),notes:document.getElementById('ckNotes').value};state.orders.unshift(order);state.activeOrderId=id;state.profile={...state.profile,name,phone,email};state.cart=[];save();view='tracking';render()}
const statusNames=['Pedido recibido','Preparando ingredientes','En el horno','Empacando','En camino','Entregado'];
function statusName(i){return statusNames[Math.max(0,Math.min(5,Number(i)||0))]}
function getActive(){if(!state.activeOrderId)return state.orders.find(o=>o.status<5)||null;return state.orders.find(o=>o.id===state.activeOrderId)||state.orders.find(o=>o.status<5)||null}
function track(id){state.activeOrderId=id;save();view='tracking';render()}
function tracking(){const o=getActive();if(!o)return `<section class="section wrap"><div class="panel"><h3>No tienes un pedido activo</h3><p class="meta">Cuando hagas un pedido podrás seguirlo aquí en tiempo real.</p><button class="primary" onclick="go('menu')">Ver postres</button></div></section>`;const icons=['✓','👩‍🍳','♨️','🎁','🛵','🏡'];return `<section class="section wrap"><div class="trackHero"><img src="${photo('photo-1551024506-0bccd828d307')}"><div class="trackCopy"><span class="pill">PEDIDO ${o.id}</span><h2>${o.status===5?'¡Pedido entregado!':'Tu pedido va avanzando'}</h2><p style="font-size:17px;line-height:1.6;color:#ffece0">${o.status===0?'Recibimos tu pedido y ya está en nuestra cocina.':o.status===1?'Estamos preparando tus postres con cuidado.':o.status===2?'Tus postres están en el horno.':o.status===3?'Estamos empacando todo para el domicilio.':o.status===4?'Tu pedido ya va camino a tu dirección.':'Gracias por pedir en Al Horno. ¡Esperamos que lo disfrutes!'}</p>${o.etaText?`<div class="eta">⏳ ${o.etaText}</div>`:''}<div style="margin-top:12px;font-size:12px;color:#ffe8d8;font-weight:800"><span class="live-dot"></span>Seguimiento en vivo · se actualiza automáticamente</div></div></div><div class="timeline">${statusNames.map((st,i)=>`<div class="step ${i<o.status?'done':i===o.status?'current':''}"><div class="circle">${i<o.status?'✓':icons[i]}</div><b>${st}</b></div>`).join('')}</div>${o.adminNote?`<div class="panel" style="margin-bottom:18px;background:#fff7ed;border-color:#f3d2b8"><div class="kicker">ACTUALIZACIÓN DEL RESTAURANTE</div><h3 style="margin:6px 0 4px">Mensaje sobre tu pedido</h3><p style="margin:0;line-height:1.6">${o.adminNote}</p></div>`:''}<div class="trackGrid"><div class="panel"><h3>🧁 Tu pedido</h3>${o.items.map(i=>{const pr=getProduct(i.id);return pr?`<div class="orderMini"><img src="${pr.img}"><div><b>${pr.name}</b><div class="meta">Cantidad: ${i.qty}</div>${dessertDetailsHTML(i)}</div></div>`:''}).join('')}</div><div class="panel"><h3>🚚 Domicilio</h3><p><b>${o.name}</b><br>${o.address}<br>${o.district}</p><p class="meta">Método de pago: ${o.payment}</p><div style="background:#f2f6ef;padding:10px 12px;border-radius:12px;color:#526b4d;font-size:13px;font-weight:800;margin:12px 0">Entrega únicamente a domicilio</div><button class="soft wide" onclick="go('orders')">Ver mis pedidos</button><button class="primary wide" style="margin-top:10px" onclick="go('support')">💬 Contactar soporte</button></div></div></section>`}
function orders(){const active=getActive();return `<section class="section wrap"><div class="head"><div><div class="kicker">Historial</div><h2>Mis pedidos</h2></div></div>${active&&active.status<5?`<div class="activeBanner"><div><span class="pill">PEDIDO ACTIVO</span><h3 style="font-family:Georgia,serif;margin:8px 0">${active.id}</h3><div>${statusName(active.status)}</div></div><button class="primary" onclick="track('${active.id}')">Ver seguimiento →</button></div>`:''}${state.orders.length?state.orders.map(o=>`<div class="panel orderCard"><div class="orderTop"><div><span class="status">${statusName(o.status)}</span><h3>${o.id}</h3><div class="meta">${new Date(o.created).toLocaleString('es-CO')} · ${o.payment}</div></div><div style="text-align:right"><b class="price">${fmt(o.total)}</b><div class="meta">${o.items.reduce((s,i)=>s+i.qty,0)} productos</div></div></div>${dessertOrderLines(o.items)}${dessertPriceNotice(o.items)}<div style="display:flex;gap:10px;margin-top:14px"><button class="soft" onclick="track('${o.id}')">${o.status<5?'Ver seguimiento':'Ver detalle'}</button><button class="ghost" onclick="repeatOrder('${o.id}')">↻ Repetir pedido</button></div></div>`).join(''):'<div class="panel">Aún no tienes pedidos.</div>'}</section>`}
function repeatOrder(id){const o=state.orders.find(x=>x.id===id);if(!o)return;state.cart=o.items.map(cloneDessertItem);save();view='cart';render()}
function favorites(){const list=allProducts().filter(p=>state.favorites.includes(p.id));return `<section class="section wrap"><div class="head"><div><div class="kicker">Guardados</div><h2>Mis favoritos</h2></div></div>${list.length?`<div class="grid">${list.map(productCard).join('')}</div>`:'<div class="panel">Aún no guardas favoritos. Usa el corazón en cualquier postre.</div>'}</section>`}
function profile(){return `<section class="section wrap"><div class="profileTop"><div class="identity"><div class="avatar">${(state.profile.name||'U')[0].toUpperCase()}</div><div><div class="kicker">Mi perfil</div><h2 style="font-family:Georgia,serif;margin:3px 0">${state.profile.name||'Cliente'}</h2><div class="meta">${state.profile.email||'Sin correo'}</div><div style="margin-top:8px;font-weight:800;color:var(--orange)">✦ 1.250 puntos · Nivel Dulce</div></div></div><button class="soft" onclick="document.getElementById('pName').focus()">Editar perfil</button></div><div class="head" style="margin-top:28px"><h2 style="font-size:26px">Direcciones guardadas</h2><button class="ghost" onclick="addAddress()">+ Agregar</button></div><div class="saved">${state.addresses.map((a,i)=>`<div class="savedCard"><b>${a.name}</b><p class="meta">${a.address}<br>${a.district}</p><button class="ghost" style="color:#b34d34" onclick="delAddress(${i})">Eliminar</button></div>`).join('')}</div><div class="head" style="margin-top:28px"><h2 style="font-size:26px">Métodos de pago</h2></div><div class="saved"><div class="savedCard"><b>Mastercard</b><p>•••• 4242</p></div><div class="savedCard"><b>Visa</b><p>•••• 8891</p></div><div class="savedCard" style="border-style:dashed"><b>＋ Agregar método</b><p class="meta">Disponible al conectar una pasarela real.</p></div></div><div class="head" style="margin-top:28px"><h2 style="font-size:26px">Datos personales</h2></div><div class="panel"><div class="formGrid"><label class="field">Nombre<input id="pName" value="${state.profile.name||''}"></label><label class="field">Teléfono<input id="pPhone" value="${state.profile.phone||''}"></label><label class="field full">Correo<input id="pEmail" value="${state.profile.email||''}"></label></div><button class="primary" onclick="saveProfile()">Guardar cambios</button></div></section>`}
function saveProfile(){state.profile={name:document.getElementById('pName').value.trim(),phone:document.getElementById('pPhone').value.trim(),email:document.getElementById('pEmail').value.trim()};save();toast('Perfil actualizado');render()}
function addAddress(){const name=prompt('Nombre de la dirección (Casa, Trabajo...)');if(!name)return;const address=prompt('Dirección');if(!address)return;const district=prompt('Barrio')||'';state.addresses.push({name,address,district});save();render()}
function delAddress(i){state.addresses.splice(i,1);if(!state.addresses.length)state.addresses=defaults().addresses;save();render()}
function support(){const my=state.supportTickets.filter(t=>!t.email||t.email===state.profile.email);const active=getActive();return `<section class="section wrap"><div class="head"><div><div class="kicker">Estamos para ayudarte</div><h2>Soporte</h2></div></div><div class="checkout"><div class="panel"><h3>Enviar un mensaje</h3><p class="meta">Tu mensaje llegará directamente al panel del administrador.</p><label class="field">Asunto<select id="supSubject"><option>Problema con mi pedido</option><option>Pago</option><option>Dirección o entrega</option><option>Producto</option><option>Otro</option></select></label><label class="field">Pedido relacionado<select id="supOrder"><option value="">Ninguno</option>${state.orders.map(o=>`<option value="${o.id}" ${active&&active.id===o.id?'selected':''}>${o.id} · ${statusName(o.status)}</option>`).join('')}</select></label><label class="field">Mensaje<textarea id="supMessage" rows="6" placeholder="Cuéntanos qué pasó o qué necesitas..."></textarea></label><button class="primary wide" onclick="sendSupport()">Enviar a soporte</button></div><div class="panel"><h3>Mis conversaciones</h3>${my.length?my.map(t=>`<div style="padding:14px 0;border-bottom:1px solid #eee"><div style="display:flex;justify-content:space-between;gap:10px"><b>${t.subject}</b><span class="status">${t.status==='new'?'Enviado':'Respondido'}</span></div><div class="meta">${new Date(t.created).toLocaleString('es-CO')}${t.orderId?' · '+t.orderId:''}</div><p>${t.message}</p>${t.response?`<div style="background:#f2f6ef;border-left:4px solid var(--green);padding:12px;border-radius:10px"><b>Solución / respuesta del restaurante</b><p style="margin-bottom:0">${t.response}</p></div>`:''}</div>`).join(''):'<p class="meta">Aún no has enviado mensajes.</p>'}</div></div></section>`}
function sendSupport(){const subject=document.getElementById('supSubject').value,orderId=document.getElementById('supOrder').value,message=document.getElementById('supMessage').value.trim();if(message.length<5){toast('Escribe un mensaje un poco más completo');return}state.supportTickets.unshift({id:'SUP-'+Date.now(),created:Date.now(),updatedAt:Date.now(),status:'new',subject,orderId,message,response:'',name:state.profile.name||'Cliente',email:state.profile.email||'',ownerEmail:(activeUserEmail||state.profile.email||'').toLowerCase()});save();render();toast('Mensaje enviado al administrador')}
function admin(){const rev=state.orders.reduce((s,o)=>s+o.total,0),pending=state.orders.filter(o=>o.status<5).length,unread=state.supportTickets.filter(t=>t.status==='new').length;return `<section class="section wrap"><div class="head"><div><div class="kicker">Administración</div><h2>Dashboard</h2></div></div><div class="stats"><div class="stat"><small>Ventas de hoy</small><b>${fmt(rev)}</b></div><div class="stat"><small>Pedidos activos</small><b>${pending}</b></div><div class="stat"><small>Productos</small><b>${allProducts().length}</b></div><div class="stat"><small>Ingresos</small><b>${fmt(rev)}</b></div><div class="stat"><small>Soporte nuevo</small><b>${unread}</b></div></div>${unread?`<div class="activeBanner" style="margin-top:22px"><div><span class="pill">SOPORTE</span><h3 style="font-family:Georgia,serif;margin:8px 0">Tienes ${unread} mensaje${unread===1?'':'s'} por responder</h3></div><button class="primary" onclick="go('adminSupport')">Abrir soporte →</button></div>`:''}</section>`}
function adminOrders(){const active=state.orders.filter(o=>o.status<5),done=state.orders.filter(o=>o.status===5);const card=o=>`<div class="panel" style="margin-bottom:14px"><div class="orderTop"><div><span class="status">${statusName(o.status)}</span><h3 style="margin:8px 0">${o.id} · ${o.name}</h3><div class="meta">${o.address} · ${fmt(o.total)} · ${o.payment}</div></div></div>${dessertOrderLines(o.items)}${dessertPriceNotice(o.items)}${o.status<5?`<label class="field">Estado<select onchange="setStatus('${o.id}',this.value)">${statusNames.map((st,i)=>`<option value="${i}" ${i===o.status?'selected':''}>${st}</option>`).join('')}</select></label><div class="formGrid"><label class="field">Tiempo que quieres informar al cliente<input id="eta-${o.id}" value="${o.etaText||''}" placeholder="Ej. 20 a 25 minutos"></label><label class="field">Actualización / solución<input id="note-${o.id}" value="${o.adminNote||''}" placeholder="Ej. Ya solucionamos el inconveniente..."></label></div><button class="soft" onclick="saveOrderReport('${o.id}')">Guardar actualización</button>`:`<div style="background:#f2f6ef;padding:12px;border-radius:12px;color:#526b4d;font-weight:800">✓ Pedido finalizado. Ya no aparece entre los pedidos pendientes.</div>`}</div>`;return `<section class="section wrap"><div class="head"><div><div class="kicker">Administración</div><h2>Pedidos</h2></div><span class="status">${active.length} activos</span></div><div class="head"><h2 style="font-size:25px">Pedidos activos</h2></div>${active.length?active.map(card).join(''):'<div class="panel">No hay pedidos pendientes.</div>'}<div class="head" style="margin-top:34px"><div><div class="kicker">Historial</div><h2 style="font-size:25px">Pedidos finalizados</h2></div></div>${done.length?done.map(card).join(''):'<div class="panel">Todavía no hay pedidos finalizados.</div>'}</section>`}
function setStatus(id,v){const o=state.orders.find(x=>x.id===id);if(o){o.status=Number(v);o.updatedAt=Date.now();if(o.status===5)o.completedAt=Date.now()}save();render();toast('Estado actualizado: '+statusName(Number(v)))}
function saveOrderReport(id){const o=state.orders.find(x=>x.id===id);if(!o)return;const eta=document.getElementById('eta-'+id),note=document.getElementById('note-'+id);o.etaText=eta?eta.value.trim():'';o.adminNote=note?note.value.trim():'';o.updatedAt=Date.now();save();render();toast('Actualización enviada al cliente')}
function adminProducts(){const list=allProducts();return `<section class="section wrap"><div class="head"><div><div class="kicker">Catálogo</div><h2>Productos</h2></div></div><div class="checkout"><div class="panel"><h3>Agregar producto</h3><p class="meta">Crea un nuevo postre y aparecerá inmediatamente en el menú de los clientes.</p><div class="formGrid"><label class="field">Nombre<input id="apName" placeholder="Ej. Waffle Oreo"></label><label class="field">Categoría<input id="apCat" placeholder="Waffles, Brownies..."></label><label class="field">Precio COP<input id="apPrice" type="number" min="1000" step="100"></label><label class="field">Precio anterior (opcional)<input id="apOld" type="number" min="0" step="100"></label><label class="field">Etiqueta (opcional)<input id="apTag" placeholder="Nuevo, Oferta..."></label><label class="field full">URL de imagen<input id="apImg" placeholder="https://..."></label><label class="field full">Descripción<textarea id="apDesc" rows="3" placeholder="Describe el postre..."></textarea></label></div><button class="primary wide" onclick="createProduct()">+ Publicar producto</button></div><div class="panel"><h3>Catálogo actual · ${list.length}</h3><div style="max-height:620px;overflow:auto">${list.map(p=>`<div style="display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #eee"><img src="${p.img}" onerror="this.src='https://images.unsplash.com/photo-1551024506-0bccd828d307?auto=format&fit=crop&w=300&q=70'" style="width:58px;height:58px;object-fit:cover;border-radius:12px"><div style="flex:1"><b>${p.name}</b><div class="meta">${p.cat} · ${fmt(p.price)}</div></div><button class="soft" onclick="toggleAvailability('${p.id}')">${isUnavailable(p.id)?'Agotado':'Disponible'}</button>${state.customProducts.some(x=>x.id===p.id)?`<button class="ghost" style="color:#b34d34" onclick="deleteProduct('${p.id}')">Eliminar</button>`:''}</div>`).join('')}</div></div></div></section>`}
function createProduct(){const name=document.getElementById('apName').value.trim(),cat=document.getElementById('apCat').value.trim(),price=Number(document.getElementById('apPrice').value),old=Number(document.getElementById('apOld').value)||0,tag=document.getElementById('apTag').value.trim(),img=document.getElementById('apImg').value.trim()||photo('photo-1551024506-0bccd828d307'),desc=document.getElementById('apDesc').value.trim();if(!name||!cat||!price||price<1000||!desc){toast('Completa nombre, categoría, precio y descripción');return}state.customProducts.unshift({id:'custom-'+Date.now(),name,cat,price,old:old||undefined,rating:5,img,desc,tag:tag||undefined});save();render();toast('Producto publicado en el menú')}
function toggleAvailability(id){const i=state.unavailable.indexOf(id);if(i>=0)state.unavailable.splice(i,1);else state.unavailable.push(id);save();render();toast(isUnavailable(id)?'Producto marcado como agotado':'Producto disponible nuevamente')}
function deleteProduct(id){if(!confirm('¿Eliminar este producto del catálogo?'))return;state.customProducts=state.customProducts.filter(p=>p.id!==id);state.unavailable=state.unavailable.filter(x=>x!==id);state.cart=state.cart.filter(x=>x.id!==id);save();render();toast('Producto eliminado')}
function adminSupport(){const tickets=state.supportTickets;return `<section class="section wrap"><div class="head"><div><div class="kicker">Atención al cliente</div><h2>Soporte</h2></div><span class="status">${tickets.filter(t=>t.status==='new').length} nuevos</span></div>${tickets.length?tickets.map(t=>`<div class="panel" style="margin-bottom:14px"><div class="orderTop"><div><span class="status">${t.status==='new'?'Nuevo':'Respondido'}</span><h3 style="margin:8px 0">${t.subject}</h3><div class="meta">${t.name||'Cliente'} · ${t.email||'Sin correo'} · ${new Date(t.created).toLocaleString('es-CO')}${t.orderId?' · Pedido '+t.orderId:''}</div></div></div><p style="font-size:16px">${t.message}</p>${t.response?`<div style="background:#f2f6ef;border-left:4px solid var(--green);padding:12px;border-radius:10px;margin-bottom:10px"><b>Tu respuesta</b><p style="margin-bottom:0">${t.response}</p></div>`:''}<label class="field">Solución / respuesta<textarea id="reply-${t.id}" rows="3" placeholder="Explica la solución o respuesta para el cliente...">${t.response||''}</textarea></label><div style="display:flex;gap:10px"><button class="primary" onclick="replySupport('${t.id}')">Enviar respuesta</button><button class="soft" onclick="closeSupport('${t.id}')">Marcar respondido</button></div></div>`).join(''):'<div class="panel">No hay mensajes de soporte.</div>'}</section>`}
function replySupport(id){const t=state.supportTickets.find(x=>x.id===id),el=document.getElementById('reply-'+id);if(!t||!el||!el.value.trim()){toast('Escribe una respuesta');return}t.response=el.value.trim();t.status='answered';t.updatedAt=Date.now();save();chrome();render();toast('Respuesta enviada al cliente')}
function closeSupport(id){const t=state.supportTickets.find(x=>x.id===id);if(t){t.status='answered';t.updatedAt=Date.now();save();chrome();render()}}
function render(){if(!role)return;chrome();let html='';if(role==='admin'){html=view==='adminOrders'?adminOrders():view==='adminProducts'?adminProducts():view==='adminSupport'?adminSupport():admin()}else{const map={home,menu,offers,cart,checkout,tracking,orders,favorites,profile,support};html=(map[view]||home)()}document.getElementById('app').innerHTML=html;updateBadge();animateView()}
renderAuth();
</script>
<script>
if (document.modelContext?.registerTool) {
  const lifetime = new AbortController();
  window.addEventListener('pagehide', () => lifetime.abort(), {once:true});
  try {
    Promise.resolve(document.modelContext.registerTool({
      name: 'buscar_postres',
      description: 'Consulta el catálogo de Al Horno por nombre o categoría, sin cambiar el carrito.',
      inputSchema: {type:'object', properties:{consulta:{type:'string'}}, required:['consulta'], additionalProperties:false},
      annotations: {readOnlyHint:true, untrustedContentHint:true},
      execute(input) {
        if (!input || typeof input.consulta !== 'string') throw new Error('La consulta debe ser texto.');
        const query = input.consulta.toLocaleLowerCase('es');
        return allProducts().filter(p => (p.name+' '+p.cat).toLocaleLowerCase('es').includes(query)).map(p => ({id:p.id,nombre:p.name,categoria:p.cat,precioCOP:p.price,disponible:!isUnavailable(p.id)}));
      }
    }, {signal:lifetime.signal})).catch(() => {});
  } catch (_) {}
}
</script>
